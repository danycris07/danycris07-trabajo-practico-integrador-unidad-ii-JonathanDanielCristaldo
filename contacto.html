<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
    <link rel="stylesheet" href="assets/css/contacto.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

    <main>

      <!-- FORMULARIO -->
      <div class="col-12 col-md-6">

        <div class="mb-2">
          <label class="form-label">Nombre</label>

        </div>

        <div class="mb-3">
          <label class="form-label">Gmail</label>
          <input type="email" class="form-control" placeholder="@gmail.com">
        </div>

        <div class="mb-3">
          <label class="form-label">Motivo de Consulta</label>
          <textarea class="form-control" rows="3"></textarea>
        </div>

        <input class="btn btn-primary" type="button" value="Enviar">

      </div> 

      <!-- DATOS DE CONTACTO -->
      <div class="col-12 col-md-6">

        <h3>Datos de Contacto</h3>
        <ul>
          <li>Direccion: Ruta Nac. 81 Km. 1190 | Formosa</li>
          <li>Email: info@ipf.edu.ar</li>
          <li>WhatsApp: 37048605</li>
        </ul>

      </div>

    </div>
  </div>
</main>


    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
